# Configuration du Broker Kafka (KRaft mode) pour environnement local et formation
# Référence : Section 4 & 5 du cahier des charges

# Identité et rôle KRaft
node.id=1
process.roles=broker,controller
controller.quorum.voters=1@localhost:9093

# Écouteurs (Listeners)
# - INTERNAL : communication inter-services / conteneurs Docker
# - EXTERNAL : accès hôte développeur (localhost:9092)
# - CONTROLLER : communication interne quorum KRaft
listeners=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
advertised.listeners=PLAINTEXT://localhost:9092
controller.listener.names=CONTROLLER
listener.security.protocol.map=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT

# Réplication et Tolérance aux pannes
# NOTE : En profil local monoconteneur, le facteur de réplication est fixé à 1.
# En production ou profil multi-brokers (détaillé dans docs/03), ce facteur est de 3 avec min.insync.replicas=2.
num.partitions=3
default.replication.factor=1
min.insync.replicas=1

# Réplication des topics internes Kafka (offsets et transactions)
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1

# Rétention des logs (7 jours par défaut, segment 1 Go)
log.retention.hours=168
log.segment.bytes=1073741824
log.retention.check.interval.ms=300000

# Nettoyage des logs (Delete par défaut pour les événements, Compact pour les projections d'état)
log.cleanup.policy=delete

# Élection des leaders et disponibilité
unclean.leader.election.enable=false
auto.create.topics.enable=false
