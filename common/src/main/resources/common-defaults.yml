# Shared defaults, pulled in by each service with `spring.config.import: classpath:common-defaults.yml`.
# Imported values take precedence over the importing file: services set only the `app.*` keys,
# spring.application.name and server.port, never the keys below.
spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${app.database}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  flyway:
    locations: classpath:db/common,classpath:db/migration # V1 shared tables, V2+ service tables
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9094,localhost:9095}
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Avro, except raw bytes (poison pills forwarded to a DLT) which pass through untouched
      value-serializer: com.example.kafka.common.kafka.AvroOrBytesSerializer
      # Idempotent producer, set explicitly: a conflicting setting (e.g. acks=1) then fails at startup
      # instead of silently disabling idempotence. Dedup holds within one producer session only:
      # a relay re-send after a restart gets a new producer id, so consumers must stay idempotent.
      acks: all # required by idempotence
      retries: 2147483647 # must be > 0
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5 # must be <= 5; order is still kept
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Wraps Avro so a poison pill reaches the error handler (-> DLT) instead of looping in poll()
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.KafkaAvroDeserializer
        specific.avro.reader: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
