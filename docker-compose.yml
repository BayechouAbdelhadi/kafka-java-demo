# Local platform. Use the Makefile (`make help`) rather than calling compose directly.
#
#   infrastructure (default)  4-node KRaft cluster (3 broker+controller, 1 broker), topic init,
#                             Schema Registry, PostgreSQL (one database per service), Kafka UI
#   --profile apps            the three Spring Boot services, built from ./Dockerfile
#
# Host ports: Kafka 9092/9094/9095/9096, Schema Registry 8081, PostgreSQL 5432, Kafka UI 8090,
#             order 8080, inventory 8082, notification 8083. No volumes: `down` resets everything.

x-kafka: &kafka
  image: apache/kafka:3.7.0
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server $$(hostname):29092 > /dev/null 2>&1"]
    interval: 5s
    timeout: 10s
    retries: 30

x-kafka-env: &kafka-env
  KAFKA_CLUSTER_ID: 4L62EnnTQNihNZcmdVsJ4A
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

x-app: &app
  profiles: [apps]
  restart: unless-stopped
  depends_on:
    schema-registry: { condition: service_healthy }
    postgres: { condition: service_healthy }
  environment:
    KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
    SCHEMA_REGISTRY_URL: http://schema-registry:8081
    POSTGRES_HOST: postgres

services:
  kafka-1:
    <<: *kafka
    hostname: kafka-1
    ports: ["9092:9092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://localhost:9092

  kafka-2:
    <<: *kafka
    hostname: kafka-2
    ports: ["9094:9094"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,EXTERNAL://localhost:9094

  kafka-3:
    <<: *kafka
    hostname: kafka-3
    ports: ["9095:9095"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9095,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092,EXTERNAL://localhost:9095

  kafka-4:
    <<: *kafka
    hostname: kafka-4
    ports: ["9096:9096"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 4
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9096
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-4:29092,EXTERNAL://localhost:9096

  # Creates every topic, then exits. Must match KafkaTopics, the DefaultErrorHandler DLTs (<topic>-dlt)
  # and the notification @RetryableTopic suffixes. Idempotent (--if-not-exists).
  kafka-init:
    image: apache/kafka:3.7.0
    depends_on:
      kafka-1: { condition: service_healthy }
      kafka-2: { condition: service_healthy }
      kafka-3: { condition: service_healthy }
      kafka-4: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for topic in orders.events orders.events-dlt inventory.events inventory.events-dlt \
                     orders.events-notification-retry orders.events-notification-dlt; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:29092 --create --if-not-exists \
            --topic "$$topic" --partitions 3 --replication-factor 3
        done

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    hostname: schema-registry
    depends_on:
      kafka-init: { condition: service_completed_successfully }
    ports: ["8081:8081"]
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: FORWARD_TRANSITIVE
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/subjects"]
      interval: 5s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:16-alpine
    hostname: postgres
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 30

  kafka-ui:
    image: kafbat/kafka-ui:v1.0.0
    depends_on:
      schema-registry: { condition: service_healthy }
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081

  order-service:
    <<: *app
    build: { context: ., args: { MODULE: order-service } }
    image: kafka-java/order-service
    ports: ["8080:8080"]

  inventory-service:
    <<: *app
    build: { context: ., args: { MODULE: inventory-service } }
    image: kafka-java/inventory-service
    ports: ["8082:8082"]

  notification-service:
    <<: *app
    build: { context: ., args: { MODULE: notification-service } }
    image: kafka-java/notification-service
    ports: ["8083:8083"]
